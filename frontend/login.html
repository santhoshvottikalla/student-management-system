<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="form-container">

        <div class="form-header">

            <h1>Login</h1>

        </div>


        <form id="loginForm">

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >


            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >


            <button
                type="submit"
                class="primary-btn"
            >
                Login
            </button>

        </form>


        <p id="loginMessage"></p>


        <p class="login-register">

            Don't have an account?

            <a href="student.html">
                Register
            </a>

        </p>

    </div>


    <script src="login.js"></script>

</body>

</html>
