<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Registration</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="form-container">

        <div class="form-header">

            <h1 id="formTitle">
                Student Registration
            </h1>

            <a href="dashboard.html"
               class="dashboard-link">
                Login
            </a>

        </div>


        <form id="studentForm">

            <!-- Name -->

            <label for="name">
                Full Name
            </label>

            <input
                type="text"
                id="name"
                placeholder="Enter full name"
                required
            >


            <!-- Email -->

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter email"
                required
            >


            <!-- Password -->

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter password"
            >


            <!-- Age -->

            <label for="age">
                Age
            </label>

            <input
                type="number"
                id="age"
                placeholder="Enter age"
                min="1"
                max="100"
                required
            >


            <!-- Branch -->

            <label for="branch">
                Branch
            </label>

            <select id="branch" required>

                <option value="">
                    Select Branch
                </option>

                <option value="CSE">
                    CSE
                </option>

                <option value="ECE">
                    ECE
                </option>

                <option value="EEE">
                    EEE
                </option>

                <option value="ME">
                    ME
                </option>

                <option value="CE">
                    CE
                </option>

            </select>


            <!-- Submit -->

            <button
                type="submit"
                id="submitButton"
                class="primary-btn"
            >
                Register Student
            </button>

        </form>


        <p id="message"></p>

    </div>


    <script src="script.js"></script>

</body>

</html>
